name: 'Preview R16 - natural footage, no website deployment'
on:
  push:
    branches: [preview/hero-r16-natural-film-20261118]
    paths:
      - scripts/build-preview-r16.sh
      - .github/workflows/build-preview-r16.yml
jobs:
  video-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Make the video preview
        run: bash scripts/build-preview-r16.sh
      - name: Commit preview MP4 to preview branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/hero-r16-natural-first-two.mp4 previews/hero-r16-natural-poster.jpg previews/warehouse-source.txt
          git commit -m "Preview MP4: natural Lodz and industrial drone footage (not for publication)"
          git push origin HEAD:preview/hero-r16-natural-film-20261118
