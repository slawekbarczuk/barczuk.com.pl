name: 'Preview R16 V3 - port aerial outro'
on:
  push:
    branches: [preview/hero-r16-natural-film-20261118]
    paths:
      - scripts/build-preview-r16-v3.sh
      - .github/workflows/build-preview-r16-v3.yml
jobs:
  port-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Create V3 MP4 with seaport as the third scene
        run: bash scripts/build-preview-r16-v3.sh
      - name: Commit preview files to preview branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/hero-r16-port-v3.mp4 previews/hero-r16-port-v3-still.jpg previews/VIDEO_R16_V3_SOURCES.md
          git commit -m "Preview R16 V3 with port finale, no text overlays"
          git push origin HEAD:preview/hero-r16-natural-film-20261118
