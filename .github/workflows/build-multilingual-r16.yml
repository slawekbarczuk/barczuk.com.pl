name: R16 multilingual static pages
on:
  push:
    branches: [feature/r16-pl-en-de-language-switcher]
    paths:
      - scripts/build-i18n-r16.cjs
      - i18n/**
      - assets/language-switcher-r16.css
      - .github/workflows/build-multilingual-r16.yml
jobs:
  generate-localized-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate Polish, English and German static pages
        run: node scripts/build-i18n-r16.cjs
      - name: Commit translated pages, SEO metadata and language switchers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html finansowanie-przedsiebiorstw/index.html informacje sitemap.xml en de
          if ! git diff --cached --quiet; then
            git commit -m "R16: static Polish, English and German pages with SEO and switcher"
            git push origin HEAD:feature/r16-pl-en-de-language-switcher
          fi
