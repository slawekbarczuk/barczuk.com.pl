name: 'Preview R16 - two giant warehouse alternatives'
on:
  push:
    branches: [preview/hero-r16-natural-film-20261118]
    paths:
      - scripts/build-preview-r16-warehouse.sh
      - .github/workflows/build-preview-r16-warehouse.yml
jobs:
  candidate-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Render two alternative short films
        run: bash scripts/build-preview-r16-warehouse.sh
      - name: Commit previews without website changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/hero-r16-warehouse-A.mp4 previews/hero-r16-warehouse-A-poster.jpg previews/hero-r16-warehouse-B.mp4 previews/hero-r16-warehouse-B-poster.jpg previews/VIDEO_R16_WAREHOUSE_CANDIDATES.md
          git commit -m "Private previews: large warehouse alternatives for R16"
          git push origin HEAD:preview/hero-r16-natural-film-20261118
