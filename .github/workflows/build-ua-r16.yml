name: Build R16 Ukrainian and compact navigation
on:
  push:
    branches:
      - feature/r16-ua-and-nav-spacing
    paths:
      - scripts/build-ua-r16.cjs
      - scripts/build-i18n-r16.cjs
      - i18n/ua-**
      - assets/language-switcher-r16.css
      - tests/i18n-r16.test.cjs
      - tests/ua-r16.test.cjs
      - .github/workflows/build-ua-r16.yml
jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build all four languages
        run: node scripts/build-i18n-r16.cjs
      - name: Regression tests
        run: node --test tests/*.test.cjs
      - name: Commit localized static pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html finansowanie-przedsiebiorstw/index.html informacje en de ua sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "R16: built Ukrainian pages and four-language navigation"
            git push origin HEAD:feature/r16-ua-and-nav-spacing
          fi
