<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#ffffff">
  <title>BARCZUK</title>
  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --text: #172033;
      --muted: #667085;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100svh;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      position: relative;
      width: min(680px, calc(100% - 32px));
      padding: clamp(48px, 8vw, 76px) clamp(28px, 7vw, 68px);
      text-align: center;
    }

    .mark {
      display: inline-grid;
      width: 52px;
      height: 52px;
      margin-bottom: 28px;
      place-items: center;
      border: 1px solid rgba(37, 99, 235, 0.22);
      border-radius: 16px;
      background: rgba(37, 99, 235, 0.06);
      color: var(--accent);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .brand {
      margin: 0 0 24px;
      font-size: clamp(14px, 2vw, 16px);
      font-weight: 650;
      letter-spacing: 0.36em;
      text-indent: 0.36em;
    }

    h1 {
      max-width: 520px;
      margin: 0 auto;
      font-size: clamp(34px, 6vw, 58px);
      font-weight: 580;
      letter-spacing: -0.045em;
      line-height: 1.04;
      text-wrap: balance;
    }

    p {
      max-width: 460px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 2.3vw, 19px);
      line-height: 1.65;
      text-wrap: balance;
    }

    @media (prefers-reduced-motion: no-preference) {
      main {
        animation: appear 700ms cubic-bezier(.2, .8, .2, 1) both;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.985);
        }
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">B</div>
    <div class="brand">BARCZUK</div>
    <h1>Strona jest obecnie niedostępna</h1>
    <p>Pracujemy nad nową wersją serwisu.</p>
  </main>

  <!-- Cloudflare Web Analytics -->
  <script
    type="module"
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token":"21e58149fb274d91ae50afc5ee2db83c"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
